data:
  raw_path: "data/raw/housing.csv"
  processed_path: "data/processed/housing_processed.csv"
  target_column: "price"
  feature_columns:
    - "square_feet"
    - "bedrooms"
    - "bathrooms"
    - "location_score"
    - "year_built"
    - "garage_spaces"

training:
  random_state: 42
  test_size: 0.2

model:
  type: "random_forest"
  n_estimators: 100
  max_depth: 8
  random_state: 42
  model_save_path: "models/model.joblib"

reports:
  metrics_path: "reports/metrics.json"
  eval_report_path: "reports/eval_report.md"

api:
  host: "0.0.0.0"
  port: 8000

