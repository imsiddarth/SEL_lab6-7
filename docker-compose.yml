services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-prediction-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_PATH=/app/models/model.joblib
    depends_on:
      - mlflow
    restart: unless-stopped
    networks:
      - ml-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped
    networks:
      - ml-network

volumes:
  mlflow-data:
    driver: local

networks:
  ml-network:
    driver: bridge

